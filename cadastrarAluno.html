<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>

<body>
    <h1>Cadastrar Aluno</h1>
    <form id="formCadastroAluno">
        <label>Nome do Aluno:</label>
        <input type="text" id="nome_aluno" name="nome_aluno">
        <br><br>
        <label>Idade:</label>
        <input type="number" id="idade_aluno" name="idade" step="0.01" min="0" max="99999.99">
        <br><br>
        <label>CPF:</label>
        <input type="number" id="cpf_aluno" name="cpf" step="0.01" min="0" max="999999999999">
        <br><br>
        <label>Data Cadastro:</label>
        <input type="date" id="data_cadastro" name="data_cadastro">
        <br><br>
        <button type="submit">Cadastrar</button>
    </form>
    <div id="message"></div>

    <script src="cadastrarAluno.js"></script>
</body>

</html>
